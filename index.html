<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Башня чисел: Roguelike Edition</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #0a0c12; color: #fff; font-family: system-ui, sans-serif;
    touch-action: none; user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    align-items: center; justify-content: center; text-align: center;
    padding: 28px; background: #101525; color: white;
    font-size: 21px; font-weight: 700; line-height: 1.6;
  }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">Поверни устройство горизонтально<br>и отправляйся в подземелье ↻</div>

<script>
(() => {
  "use strict";

  const canvas = document.querySelector("#game");
  const ctx = canvas.getContext("2d", { alpha: false });

  const W = 960, H = 600;
  // Границы комнаты
  const ROOM_X = 80, ROOM_Y = 80, ROOM_W = 800, ROOM_H = 440;
  
  let dpr = 1, scale = 1, offsetX = 0, offsetY = 0;
  let bgCanvas;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    scale = Math.min(canvas.width / W, canvas.height / H);
    offsetX = (canvas.width - W * scale) / 2;
    offsetY = (canvas.height - H * scale) / 2;
  }

  function pointFromEvent(e) {
    return {
      x: (e.clientX * dpr - offsetX) / scale,
      y: (e.clientY * dpr - offsetY) / scale
    };
  }

  // --- Предметы и экипировка ---
  const ITEM_POOL = [
    { name: "Кровавый глаз", type: "damage", color: "#ff4444", desc: "+1 урон" },
    { name: "Слеза скорости", type: "tears", color: "#ffff44", desc: "Скорострельность ↑" },
    { name: "Крылья", type: "speed", color: "#44aaff", desc: "Скорость ↑" },
    { name: "Дальнобойность", type: "range", color: "#44ff44", desc: "Дальность ↑" },
    { name: "Стальной клинок", type: "weapon", weapon: "sword", color: "#dddddd", desc: "Ближний бой" },
    { name: "Костяной лук", type: "weapon", weapon: "bow", color: "#ffcc44", desc: "Пробивные стрелы" },
    { name: "Сердце", type: "health", color: "#ff44ff", desc: "+1 контейнер здоровья" }
  ];

  const state = {
    floor: 1,
    rooms: {},
    currentRoom: { x: 4, y: 4 },
    hero: null,
    enemies: [],
    tears: [],
    enemyTears: [],
    drops: [],
    particles: [],
    pedestals: [],
    kills: 0,
    gameOver: false,
    joystick: { active: false, id: null, startX: 0, startY: 0, x: 0, y: 0, dx: 0, dy: 0 },
    rightStick: { active: false, id: null, startX: 0, startY: 0, x: 0, y: 0, dx: 0, dy: 0 },
    keys: {},
    shootCooldown: 0,
    shake: 0,
    message: "",
    messageTime: 0,
    transition: 0
  };

  function say(text, duration = 2) {
    state.message = text;
    state.messageTime = duration;
  }

  function addParticle(x, y, color, amount, speed) {
    for (let i = 0; i < amount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = speed * (0.3 + Math.random() * 0.7);
      state.particles.push({
        x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
        life: 0.4 + Math.random() * 0.4, maxLife: 0.8, size: 2 + Math.random() * 4, color
      });
    }
  }

  // --- Генерация этажа ---
  function generateFloor() {
    state.rooms = {};
    const gridSize = 9;
    let roomCount = 6 + state.floor * 2;
    if (roomCount > 15) roomCount = 15;
    
    const queue = [{x: 4, y: 4}];
    const created = new Set(["4,4"]);
    state.rooms["4,4"] = { x: 4, y: 4, type: 'start', cleared: true, visited: true };
    
    while (created.size < roomCount && queue.length > 0) {
      const current = queue.shift();
      const dirs = [[0,-1],[0,1],[-1,0],[1,0]].sort(() => Math.random() - 0.5);
      
      for (const [dx, dy] of dirs) {
        if (created.size >= roomCount) break;
        const nx = current.x + dx, ny = current.y + dy;
        if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) continue;
        if (created.has(`${nx},${ny}`)) continue;
        
        if (Math.random() < 0.7) {
          created.add(`${nx},${ny}`);
          state.rooms[`${nx},${ny}`] = { x: nx, y: ny, type: 'combat', cleared: false, visited: false };
          queue.push({x: nx, y: ny});
        }
      }
    }
    
    // Поиск самой дальней комнаты для Босса
    const distances = { "4,4": 0 };
    const bfsQ = [{x: 4, y: 4}];
    let maxDist = 0, bossPos = null;
    
    while (bfsQ.length > 0) {
      const curr = bfsQ.shift();
      const key = `${curr.x},${curr.y}`;
      if (distances[key] > maxDist && state.rooms[key].type !== 'start') {
        maxDist = distances[key];
        bossPos = { x: curr.x, y: curr.y };
      }
      for (const [dx, dy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
        const nk = `${curr.x+dx},${curr.y+dy}`;
        if (state.rooms[nk] && distances[nk] === undefined) {
          distances[nk] = distances[key] + 1;
          bfsQ.push({ x: curr.x+dx, y: curr.y+dy });
        }
      }
    }
    if (bossPos) state.rooms[`${bossPos.x},${bossPos.y}`].type = 'boss';
    
    // Сокровищница
    let treasureAssigned = false;
    for (const key in state.rooms) {
      if (state.rooms[key].type === 'combat' && !treasureAssigned) {
        if (Math.random() < 0.5) { state.rooms[key].type = 'treasure'; treasureAssigned = true; }
      }
    }
    if (!treasureAssigned) {
      for (const key in state.rooms) {
        if (state.rooms[key].type === 'combat') { state.rooms[key].type = 'treasure'; break; }
      }
    }

    // Установка дверей
    for (const key in state.rooms) {
      const r = state.rooms[key];
      r.doors = { top: false, bottom: false, left: false, right: false };
      if (state.rooms[`${r.x},${r.y-1}`]) r.doors.top = true;
      if (state.rooms[`${r.x},${r.y+1}`]) r.doors.bottom = true;
      if (state.rooms[`${r.x-1},${r.y}`]) r.doors.left = true;
      if (state.rooms[`${r.x+1},${r.y}`]) r.doors.right = true;
    }
    
    state.currentRoom = { x: 4, y: 4 };
    state.hero.x = ROOM_X + ROOM_W / 2;
    state.hero.y = ROOM_Y + ROOM_H / 2;
  }

  function changeRoom(dx, dy) {
    const nx = state.currentRoom.x + dx, ny = state.currentRoom.y + dy;
    const next = state.rooms[`${nx},${ny}`];
    if (!next) return;
    
    state.transition = 0.4;
    state.currentRoom = { x: nx, y: ny };
    next.visited = true;
    
    if (dx === 1) state.hero.x = ROOM_X + 25;
    if (dx === -1) state.hero.x = ROOM_X + ROOM_W - 25;
    if (dy === 1) state.hero.y = ROOM_Y + 25;
    if (dy === -1) state.hero.y = ROOM_Y + ROOM_H - 25;
    
    state.tears = [];
    state.enemyTears = [];
    state.particles = [];
    state.pedestals = [];
    
    if (next.type === 'combat' && !next.cleared) spawnEnemies();
    else if (next.type === 'boss' && !next.cleared) spawnBoss();
    else if (next.type === 'treasure' && !next.cleared) {
      next.cleared = true;
      const item = ITEM_POOL[Math.floor(Math.random() * ITEM_POOL.length)];
      state.pedestals.push({ x: ROOM_X + ROOM_W/2, y: ROOM_Y + ROOM_H/2, item });
    }
  }

  function spawnEnemies() {
    const count = 2 + Math.floor(Math.random() * 3) + Math.floor(state.floor / 2);
    for (let i = 0; i < count; i++) {
      let x, y;
      do {
        x = ROOM_X + 60 + Math.random() * (ROOM_W - 120);
        y = ROOM_Y + 60 + Math.random() * (ROOM_H - 120);
      } while (Math.hypot(x - state.hero.x, y - state.hero.y) < 150);
      
      const isFly = Math.random() < 0.4;
      state.enemies.push({
        x, y, type: isFly ? 'fly' : 'slime',
        hp: isFly ? 6 + state.floor : 12 + state.floor * 2,
        maxHp: isFly ? 6 + state.floor : 12 + state.floor * 2,
        speed: isFly ? 3.5 : 2.5, size: isFly ? 10 : 18,
        damage: 1, hit: 0, phase: Math.random() * 10, timer: 0, vx: 0, vy: 0
      });
    }
  }

  function spawnBoss() {
    state.enemies.push({
      x: ROOM_X + ROOM_W/2, y: ROOM_Y + 100, type: 'boss',
      hp: 120 + state.floor * 50, maxHp: 120 + state.floor * 50,
      speed: 1.5, size: 40, damage: 2, hit: 0, phase: 0, timer: 0, shootTimer: 2, vx: 0, vy: 0
    });
  }

  function newRun() {
    state.floor = 1;
    state.kills = 0;
    state.gameOver = false;
    state.hero = {
      x: 0, y: 0, hp: 6, maxHp: 6, speed: 3.5, damage: 3.5, tearDelay: 0.35,
      range: 1.0, shotSpeed: 10, coins: 0, keys: 0, weapon: 'tear',
      invuln: 0, facing: 0, moving: false, walkTimer: 0
    };
    state.enemies = []; state.tears = []; state.enemyTears = [];
    state.drops = []; state.particles = []; state.pedestals = [];
    state.shootCooldown = 0; state.shake = 0; state.transition = 0;
    generateFloor();
    say("Найди босса и убей его!");
  }

  // --- Боевая система ---
  function shoot() {
    const h = state.hero;
    if (state.shootCooldown > 0) return;
    
    let angle = h.facing;
    let target = null, nearest = 1000;
    for (const e of state.enemies) {
      const d = Math.hypot(e.x - h.x, e.y - h.y);
      if (d < nearest) { nearest = d; target = e; }
    }
    
    if (state.rightStick.active && Math.hypot(state.rightStick.dx, state.rightStick.dy) > 0.1) {
      angle = Math.atan2(state.rightStick.dy, state.rightStick.dx);
    } else if (target) {
      angle = Math.atan2(target.y - h.y, target.x - h.x);
    } else if (state.joystick.active && Math.hypot(state.joystick.dx, state.joystick.dy) > 0.1) {
      angle = Math.atan2(state.joystick.dy, state.joystick.dx);
    }
    h.facing = angle;

    if (h.weapon === 'sword') {
      state.tears.push({
        x: h.x + Math.cos(angle) * 30, y: h.y + Math.sin(angle) * 30,
        vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15,
        damage: h.damage * 2, range: 30, dist: 0, size: 30,
        color: "#ffffff", isSword: true, life: 0.15
      });
      state.shootCooldown = h.tearDelay * 0.5;
      state.shake = Math.max(state.shake, 4);
    } else if (h.weapon === 'bow') {
      state.tears.push({
        x: h.x + Math.cos(angle) * 15, y: h.y + Math.sin(angle) * 15,
        vx: Math.cos(angle) * 15 * h.shotSpeed, vy: Math.sin(angle) * 15 * h.shotSpeed,
        damage: h.damage * 0.8, range: 60 * h.range, dist: 0, size: 4,
        color: "#ffcc44", life: 2
      });
      state.shootCooldown = h.tearDelay;
    } else {
      state.tears.push({
        x: h.x + Math.cos(angle) * 15, y: h.y + Math.sin(angle) * 15,
        vx: Math.cos(angle) * 8 * h.shotSpeed, vy: Math.sin(angle) * 8 * h.shotSpeed,
        damage: h.damage, range: 60 * h.range, dist: 0, size: 6,
        color: "#71d9ff", life: 2
      });
      state.shootCooldown = h.tearDelay;
    }
  }

  function damageEnemy(e, dmg) {
    e.hp -= dmg;
    e.hit = 0.1;
    state.shake = Math.max(state.shake, 3);
    addParticle(e.x, e.y, "#ff4444", 5, 100);
    
    if (e.hp <= 0) {
      state.kills++;
      const idx = state.enemies.indexOf(e);
      if (idx > -1) state.enemies.splice(idx, 1);
      addParticle(e.x, e.y, "#aa44ff", 15, 150);
      
      if (e.type === 'boss') {
        state.drops.push({ x: e.x, y: e.y, type: 'trapdoor', phase: 0 });
        state.drops.push({ x: e.x + 40, y: e.y, type: 'heart', phase: 0 });
      } else {
        if (Math.random() < 0.15) state.drops.push({ x: e.x, y: e.y, type: 'coin', phase: 0 });
        if (Math.random() < 0.08) state.drops.push({ x: e.x, y: e.y, type: 'heart', phase: 0 });
      }
    }
  }

  function applyItem(item) {
    const h = state.hero;
    if (item.type === 'health') { h.maxHp += 2; h.hp += 2; }
    else if (item.type === 'damage') h.damage += 1;
    else if (item.type === 'tears') h.tearDelay *= 0.8;
    else if (item.type === 'speed') h.speed += 0.5;
    else if (item.type === 'range') h.range += 0.5;
    else if (item.type === 'weapon') h.weapon = item.weapon;
    
    addParticle(h.x, h.y, item.color, 20, 150);
    say("Получено: " + item.name, 2.5);
  }

  // --- Обновление логики ---
  function update(dt) {
    if (state.gameOver) return;
    if (state.transition > 0) { state.transition -= dt * 3; if (state.transition < 0) state.transition = 0; }
    if (state.messageTime > 0) state.messageTime -= dt;
    
    state.shake = Math.max(0, state.shake - dt * 15);
    state.shootCooldown = Math.max(0, state.shootCooldown - dt);
    const h = state.hero;
    h.invuln = Math.max(0, h.invuln - dt);

    // Движение
    let mx = 0, my = 0;
    if (state.joystick.active) {
      mx = state.joystick.dx; my = state.joystick.dy;
    } else {
      if (state.keys['a']) mx -= 1;
      if (state.keys['d']) mx += 1;
      if (state.keys['w']) my -= 1;
      if (state.keys['s']) my += 1;
    }
    
    const len = Math.hypot(mx, my);
    if (len > 0.1) {
      mx /= len; my /= len;
      h.x += mx * h.speed * 60 * dt;
      h.y += my * h.speed * 60 * dt;
      h.walkTimer += dt * 15;
      h.moving = true;
    } else {
      h.moving = false;
    }

    // Стрельба
    let shooting = false;
    if (state.rightStick.active) shooting = Math.hypot(state.rightStick.dx, state.rightStick.dy) > 0.3;
    else if (state.keys[' ']) shooting = true;
    if (shooting && state.shootCooldown <= 0) shoot();

    // Коллизии со стенами и дверями
    const room = state.rooms[`${state.currentRoom.x},${state.currentRoom.y}`];
    if (room.cleared) {
      if (room.doors.top && h.y < ROOM_Y + 20 && Math.abs(h.x - (ROOM_X + ROOM_W/2)) < 40) { changeRoom(0, -1); return; }
      if (room.doors.bottom && h.y > ROOM_Y + ROOM_H - 20 && Math.abs(h.x - (ROOM_X + ROOM_W/2)) < 40) { changeRoom(0, 1); return; }
      if (room.doors.left && h.x < ROOM_X + 20 && Math.abs(h.y - (ROOM_Y + ROOM_H/2)) < 40) { changeRoom(-1, 0); return; }
      if (room.doors.right && h.x > ROOM_X + ROOM_W - 20 && Math.abs(h.y - (ROOM_Y + ROOM_H/2)) < 40) { changeRoom(1, 0); return; }
    }
    h.x = Math.max(ROOM_X + 15, Math.min(ROOM_X + ROOM_W - 15, h.x));
    h.y = Math.max(ROOM_Y + 15, Math.min(ROOM_Y + ROOM_H - 15, h.y));

    // Враги
    for (let i = state.enemies.length - 1; i >= 0; i--) {
      const e = state.enemies[i];
      e.phase += dt * 5;
      if (e.hit > 0) e.hit -= dt;

      if (e.type === 'slime') {
        e.timer += dt;
        if (e.timer > 1) {
          e.timer = 0;
          const ang = Math.atan2(h.y - e.y, h.x - e.x);
          e.vx = Math.cos(ang) * 150; e.vy = Math.sin(ang) * 150;
        }
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.vx *= 0.92; e.vy *= 0.92;
      } else if (e.type === 'fly') {
        const ang = Math.atan2(h.y - e.y, h.x - e.x);
        e.x += Math.cos(ang + Math.sin(e.phase)*0.5) * e.speed * 60 * dt;
        e.y += Math.sin(ang + Math.sin(e.phase)*0.5) * e.speed * 60 * dt;
      } else if (e.type === 'boss') {
        const ang = Math.atan2(h.y - e.y, h.x - e.x);
        if (Math.hypot(h.x - e.x, h.y - e.y) > 150) {
          e.x += Math.cos(ang) * e.speed * 60 * dt;
          e.y += Math.sin(ang) * e.speed * 60 * dt;
        }
        e.shootTimer -= dt;
        if (e.shootTimer <= 0) {
          e.shootTimer = 1.8;
          for (let a = -1; a <= 1; a++) {
            state.enemyTears.push({
              x: e.x, y: e.y, vx: Math.cos(ang + a * 0.3) * 4, vy: Math.sin(ang + a * 0.3) * 4,
              damage: 1, life: 3, size: 8, color: "#ff44aa"
            });
          }
        }
      }

      // Урон игроку
      if (Math.hypot(h.x - e.x, h.y - e.y) < 18 + e.size && h.invuln <= 0) {
        h.hp -= e.damage;
        h.invuln = 1.0;
        state.shake = 10;
        addParticle(h.x, h.y, "#ff0000", 10, 150);
        const kbAng = Math.atan2(h.y - e.y, h.x - e.x);
        h.x += Math.cos(kbAng) * 40; h.y += Math.sin(kbAng) * 40;
        if (h.hp <= 0) { h.hp = 0; state.gameOver = true; }
      }
    }

    // Снаряды игрока
    for (let i = state.tears.length - 1; i >= 0; i--) {
      const t = state.tears[i];
      t.x += t.vx * 60 * dt; t.y += t.vy * 60 * dt;
      t.life -= dt;
      
      let hit = false;
      for (const e of state.enemies) {
        if (Math.hypot(e.x - t.x, e.y - t.y) < e.size + t.size) {
          damageEnemy(e, t.damage);
          hit = true;
          if (!t.isSword && state.hero.weapon !== 'bow') break;
        }
      }
      if (hit || t.life <= 0 || t.x < ROOM_X || t.x > ROOM_X + ROOM_W || t.y < ROOM_Y || t.y > ROOM_Y + ROOM_H) {
        state.tears.splice(i, 1);
      }
    }

    // Снаряды врагов
    for (let i = state.enemyTears.length - 1; i >= 0; i--) {
      const t = state.enemyTears[i];
      t.x += t.vx * 60 * dt; t.y += t.vy * 60 * dt; t.life -= dt;
      
      if (Math.hypot(h.x - t.x, h.y - t.y) < 15 + t.size && h.invuln <= 0) {
        h.hp -= t.damage; h.invuln = 1.0; state.shake = 8;
        addParticle(h.x, h.y, "#ff0000", 8, 100);
        if (h.hp <= 0) { h.hp = 0; state.gameOver = true; }
        state.enemyTears.splice(i, 1); continue;
      }
      if (t.life <= 0 || t.x < ROOM_X || t.x > ROOM_X + ROOM_W || t.y < ROOM_Y || t.y > ROOM_Y + ROOM_H) {
        state.enemyTears.splice(i, 1);
      }
    }

    // Дропы и предметы
    for (let i = state.drops.length - 1; i >= 0; i--) {
      const d = state.drops[i];
      d.phase += dt * 3;
      if (d.type === 'trapdoor') {
        if (Math.hypot(h.x - d.x, h.y - d.y) < 30) {
          state.floor++; state.drops = []; state.enemies = []; generateFloor();
          return;
        }
      } else if (Math.hypot(h.x - d.x, h.y - d.y) < 25) {
        if (d.type === 'coin') { h.coins++; say("Монета!"); }
        else if (d.type === 'heart') {
          if (h.hp >= h.maxHp) continue;
          h.hp = Math.min(h.maxHp, h.hp + 2); say("Сердце!");
        }
        state.drops.splice(i, 1);
      }
    }

    for (let i = state.pedestals.length - 1; i >= 0; i--) {
      const p = state.pedestals[i];
      if (Math.hypot(h.x - p.x, h.y - p.y) < 30) {
        applyItem(p.item);
        state.pedestals.splice(i, 1);
      }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92; p.life -= dt;
      if (p.life <= 0) state.particles.splice(i, 1);
    }

    // Проверка зачистки
    if (state.enemies.length === 0 && !room.cleared && room.type !== 'start') {
      room.cleared = true;
      addParticle(ROOM_X + ROOM_W/2, ROOM_Y + ROOM_H/2, "#ffffff", 20, 80);
    }
  }

  // --- Отрисовка ---
  function drawRoomBg() {
    // Стены
    ctx.fillStyle = "#0f111a";
    ctx.fillRect(ROOM_X - 20, ROOM_Y - 20, ROOM_W + 40, ROOM_H + 40);
    // Пол
    ctx.fillStyle = "#222533";
    ctx.fillRect(ROOM_X, ROOM_Y, ROOM_W, ROOM_H);
    for (let x = ROOM_X; x < ROOM_X + ROOM_W; x += 40) {
      for (let y = ROOM_Y; y < ROOM_Y + ROOM_H; y += 40) {
        if ((x/40 + y/40) % 2 === 0) { ctx.fillStyle = "#1d202c"; ctx.fillRect(x, y, 40, 40); }
      }
    }
    // Двери
    const r = state.rooms[`${state.currentRoom.x},${state.currentRoom.y}`];
    const drawDoor = (x, y, w, h, open) => {
      ctx.fillStyle = open ? "#3a4a5a" : "#0f111a";
      ctx.fillRect(x - w/2, y - h/2, w, h);
      if (open) { ctx.strokeStyle = "#88ccff"; ctx.lineWidth = 2; ctx.strokeRect(x - w/2, y - h/2, w, h); }
    };
    if (r.doors.top) drawDoor(ROOM_X + ROOM_W/2, ROOM_Y, 80, 20, r.cleared);
    if (r.doors.bottom) drawDoor(ROOM_X + ROOM_W/2, ROOM_Y + ROOM_H, 80, 20, r.cleared);
    if (r.doors.left) drawDoor(ROOM_X, ROOM_Y + ROOM_H/2, 20, 80, r.cleared);
    if (r.doors.right) drawDoor(ROOM_X + ROOM_W, ROOM_Y + ROOM_H/2, 20, 80, r.cleared);
  }

  function drawHero() {
    const h = state.hero;
    const flicker = h.invuln > 0 && Math.floor(performance.now() / 80) % 2 === 0;
    
    // Тень
    ctx.fillStyle = "#00000066";
    ctx.beginPath(); ctx.ellipse(h.x, h.y + 16, 14, 6, 0, 0, Math.PI * 2); ctx.fill();

    if (flicker) ctx.globalAlpha = 0.5;

    let bob = h.moving ? Math.sin(h.walkTimer) * 2 : 0;
    
    // Ноги
    ctx.fillStyle = "#f0d5c1";
    const fo = h.moving ? Math.sin(h.walkTimer) * 4 : 0;
    ctx.beginPath();
    ctx.ellipse(h.x - 5, h.y + 10 + fo, 4, 6, 0, 0, Math.PI * 2);
    ctx.ellipse(h.x + 5, h.y + 10 - fo, 4, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Тело
    ctx.beginPath(); ctx.ellipse(h.x, h.y + 2 + bob, 10, 12, 0, 0, Math.PI * 2); ctx.fill();
    // Голова
    ctx.beginPath(); ctx.arc(h.x, h.y - 12 + bob, 14, 0, Math.PI * 2); ctx.fill();

    // Глаза
    ctx.fillStyle = "#000";
    const lookX = Math.cos(h.facing) * 2, lookY = Math.sin(h.facing) * 2;
    ctx.beginPath();
    ctx.arc(h.x - 4 + lookX, h.y - 14 + bob + lookY, 2, 0, Math.PI * 2);
    ctx.arc(h.x + 4 + lookX, h.y - 14 + bob + lookY, 2, 0, Math.PI * 2);
    ctx.fill();

    // Оружие
    ctx.save();
    ctx.translate(h.x, h.y - 5 + bob); ctx.rotate(h.facing);
    if (h.weapon === 'sword') {
      ctx.fillStyle = "#ddd"; ctx.fillRect(10, -3, 20, 6);
      ctx.fillStyle = "#aa8844"; ctx.fillRect(6, -5, 4, 10);
    } else if (h.weapon === 'bow') {
      ctx.strokeStyle = "#ffcc44"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(15, 0, 10, -Math.PI/2, Math.PI/2); ctx.stroke();
    }
    ctx.restore();

    ctx.globalAlpha = 1;
  }

  function drawEnemy(e) {
    ctx.fillStyle = "#00000066";
    ctx.beginPath(); ctx.ellipse(e.x, e.y + e.size/2 + 5, e.size, e.size/2, 0, 0, Math.PI * 2); ctx.fill();

    if (e.type === 'slime') {
      const squash = Math.sin(e.phase * 2) * 0.2 + 1;
      ctx.fillStyle = e.hit > 0 ? "#fff" : "#44dd44";
      ctx.beginPath(); ctx.ellipse(e.x, e.y, e.size, e.size * squash, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.arc(e.x - 5, e.y - 5, 2, 0, Math.PI * 2); ctx.arc(e.x + 5, e.y - 5, 2, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'fly') {
      const wing = Math.sin(e.phase * 10) * 5;
      ctx.fillStyle = e.hit > 0 ? "#fff" : "#ff4444";
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffffff88";
      ctx.beginPath();
      ctx.ellipse(e.x - 10, e.y - 10, 8, wing, -0.5, 0, Math.PI * 2);
      ctx.ellipse(e.x + 10, e.y - 10, 8, wing, 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.type === 'boss') {
      ctx.fillStyle = e.hit > 0 ? "#fff" : "#aa44ff";
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffcc44";
      ctx.beginPath();
      ctx.moveTo(e.x - 20, e.y - 20); ctx.lineTo(e.x - 30, e.y - 50); ctx.lineTo(e.x - 10, e.y - 30);
      ctx.moveTo(e.x + 20, e.y - 20); ctx.lineTo(e.x + 30, e.y - 50); ctx.lineTo(e.x + 10, e.y - 30);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(e.x - 15, e.y - 10, 6, 0, Math.PI * 2); ctx.arc(e.x + 15, e.y - 10, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.arc(e.x - 15, e.y - 10, 3, 0, Math.PI * 2); ctx.arc(e.x + 15, e.y - 10, 3, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawHeart(x, y, size) {
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.3);
    ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.3);
    ctx.bezierCurveTo(x - size, y + size * 0.7, x, y + size * 1.1, x, y + size * 1.1);
    ctx.bezierCurveTo(x, y + size * 1.1, x + size, y + size * 0.7, x + size, y + size * 0.3);
    ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
    ctx.fill();
  }

  function drawUI() {
    // Сердца
    let maxHearts = Math.ceil(state.hero.maxHp / 2), chp = state.hero.hp;
    for (let i = 0; i < maxHearts; i++) {
      const hx = 40 + (i % 6) * 30, hy = 40 + Math.floor(i / 6) * 30;
      ctx.fillStyle = "#333"; drawHeart(hx, hy, 10);
      if (chp >= 2) { ctx.fillStyle = "#ff4444"; drawHeart(hx, hy, 10); }
      else if (chp === 1) {
        ctx.save(); ctx.beginPath(); ctx.rect(hx - 15, hy - 15, 15, 30); ctx.clip();
        ctx.fillStyle = "#ff4444"; drawHeart(hx, hy, 10); ctx.restore();
      }
      chp -= 2; if (chp < 0) chp = 0;
    }
    
    // Монеты и Этаж
    ctx.font = "bold 16px system-ui"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffdd44"; ctx.fillText("🪙 " + state.hero.coins, W - 200, 40);
    ctx.fillStyle = "#ffffff"; ctx.fillText("ЭТАЖ " + state.floor, W - 200, 70);

    // Миникарта
    const size = 12, startX = W - 160, startY = 100;
    ctx.fillStyle = "#00000088"; ctx.fillRect(startX - 10, startY - 10, 140, 110);
    for (const key in state.rooms) {
      const room = state.rooms[key];
      if (!room.visited) continue;
      const rx = startX + (room.x - state.currentRoom.x) * size + 60;
      const ry = startY + (room.y - state.currentRoom.y) * size + 50;
      if (rx < startX || rx > startX + 120 || ry < startY || ry > startY + 90) continue;
      
      if (room.x === state.currentRoom.x && room.y === state.currentRoom.y) ctx.fillStyle = "#fff";
      else if (room.type === 'boss') ctx.fillStyle = "#ff4444";
      else if (room.type === 'treasure') ctx.fillStyle = "#ffff44";
      else if (room.cleared) ctx.fillStyle = "#aaa";
      else ctx.fillStyle = "#555";
      ctx.fillRect(rx, ry, size - 2, size - 2);
    }

    // Полоса здоровья Босса
    if (state.currentRoom && state.rooms[`${state.currentRoom.x},${state.currentRoom.y}`].type === 'boss') {
      const boss = state.enemies.find(e => e.type === 'boss');
      if (boss) {
        ctx.fillStyle = "#000000aa"; ctx.fillRect(W/2 - 200, H - 30, 400, 16);
        ctx.fillStyle = "#ff44aa"; ctx.fillRect(W/2 - 198, H - 28, 396 * (boss.hp / boss.maxHp), 12);
      }
    }

    // Стики
    const drawStick = (baseX, baseY, stick, color) => {
      ctx.fillStyle = "#ffffff22"; ctx.beginPath(); ctx.arc(baseX, baseY, 60, 0, Math.PI * 2); ctx.fill();
      let sx = baseX, sy = baseY;
      if (stick.active) { sx = stick.x; sy = stick.y; }
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(sx, sy, 25, 0, Math.PI * 2); ctx.fill();
    };
    drawStick(100, H - 100, state.joystick, "#ffffff88");
    drawStick(W - 100, H - 100, state.rightStick, "#ffcccc88");

    // Сообщение
    if (state.messageTime > 0) {
      ctx.fillStyle = "#000000cc"; ctx.fillRect(W/2 - 200, H - 60, 400, 30);
      ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold 16px system-ui";
      ctx.fillText(state.message, W/2, H - 45);
    }
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#0a0c12";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);

    const sx = (Math.random() - 0.5) * state.shake;
    const sy = (Math.random() - 0.5) * state.shake;
    ctx.save();
    ctx.translate(sx, sy);

    drawRoomBg();

    // Дропы
    for (const d of state.drops) {
      const bob = Math.sin(d.phase) * 5;
      if (d.type === 'trapdoor') {
        ctx.fillStyle = "#111"; ctx.beginPath(); ctx.ellipse(d.x, d.y, 30, 15, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#aa44ff"; ctx.lineWidth = 3; ctx.stroke();
      } else if (d.type === 'coin') {
        ctx.fillStyle = "#ffdd44"; ctx.beginPath(); ctx.arc(d.x, d.y + bob, 10, 0, Math.PI * 2); ctx.fill();
      } else if (d.type === 'heart') {
        ctx.fillStyle = "#ff4444"; drawHeart(d.x, d.y + bob - 10, 10);
      }
    }

    // Пьедесталы
    for (const p of state.pedestals) {
      ctx.fillStyle = "#444"; ctx.beginPath(); ctx.ellipse(p.x, p.y + 15, 25, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#666"; ctx.fillRect(p.x - 10, p.y - 5, 20, 20);
      const bob = Math.sin(performance.now() / 500) * 5;
      ctx.fillStyle = p.item.color + "44"; ctx.beginPath(); ctx.arc(p.x, p.y - 20 + bob, 25, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = p.item.color; ctx.beginPath(); ctx.arc(p.x, p.y - 20 + bob, 15, 0, Math.PI * 2); ctx.fill();
    }

    for (const e of state.enemies) drawEnemy(e);

    // Снаряды
    for (const t of state.tears) {
      ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2); ctx.fill();
      if (!t.isSword) {
        ctx.fillStyle = "#ffffff88"; ctx.beginPath(); ctx.arc(t.x - t.size/3, t.y - t.size/3, t.size/3, 0, Math.PI * 2); ctx.fill();
      }
    }
    for (const t of state.enemyTears) {
      ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2); ctx.fill();
    }

    drawHero();

    // Частицы
    for (const p of state.particles) {
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // Интерфейс поверх всего
    drawUI();

    if (state.transition > 0) {
      ctx.fillStyle = `rgba(0, 0, 0, ${state.transition})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state.gameOver) {
      ctx.fillStyle = "#000000cc"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ff4444"; ctx.font = "bold 40px system-ui"; ctx.textAlign = "center";
      ctx.fillText("ВЫ ПОГИБЛИ", W/2, H/2 - 20);
      ctx.fillStyle = "#fff"; ctx.font = "20px system-ui";
      ctx.fillText("Этаж " + state.floor + " | Убито врагов: " + state.kills, W/2, H/2 + 30);
      ctx.fillStyle = "#aaa"; ctx.fillText("Нажмите, чтобы начать заново", W/2, H/2 + 80);
    }
  }

  // --- Ввод ---
  function pointerDown(e) {
    e.preventDefault();
    if (state.gameOver) { newRun(); return; }
    const p = pointFromEvent(e);
    if (p.x < W / 2) {
      state.joystick.active = true; state.joystick.id = e.pointerId;
      state.joystick.startX = p.x; state.joystick.startY = p.y;
      state.joystick.x = p.x; state.joystick.y = p.y; state.joystick.dx = 0; state.joystick.dy = 0;
    } else {
      state.rightStick.active = true; state.rightStick.id = e.pointerId;
      state.rightStick.startX = p.x; state.rightStick.startY = p.y;
      state.rightStick.x = p.x; state.rightStick.y = p.y; state.rightStick.dx = 0; state.rightStick.dy = 0;
    }
  }

  function pointerMove(e) {
    const p = pointFromEvent(e);
    if (state.joystick.active && state.joystick.id === e.pointerId) {
      let dx = p.x - state.joystick.startX, dy = p.y - state.joystick.startY;
      const len = Math.hypot(dx, dy);
      if (len > 60) { dx *= 60 / len; dy *= 60 / len; }
      state.joystick.dx = dx / 60; state.joystick.dy = dy / 60;
      state.joystick.x = state.joystick.startX + dx; state.joystick.y = state.joystick.startY + dy;
    }
    if (state.rightStick.active && state.rightStick.id === e.pointerId) {
      let dx = p.x - state.rightStick.startX, dy = p.y - state.rightStick.startY;
      const len = Math.hypot(dx, dy);
      if (len > 60) { dx *= 60 / len; dy *= 60 / len; }
      state.rightStick.dx = dx / 60; state.rightStick.dy = dy / 60;
      state.rightStick.x = state.rightStick.startX + dx; state.rightStick.y = state.rightStick.startY + dy;
    }
  }

  function pointerUp(e) {
    if (state.joystick.id === e.pointerId) {
      state.joystick.active = false; state.joystick.dx = 0; state.joystick.dy = 0;
    }
    if (state.rightStick.id === e.pointerId) {
      state.rightStick.active = false; state.rightStick.dx = 0; state.rightStick.dy = 0;
    }
  }

  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
    state.keys[k] = true;
  });
  addEventListener("keyup", e => { state.keys[e.key.toLowerCase()] = false; });

  canvas.addEventListener("pointerdown", pointerDown);
  canvas.addEventListener("pointermove", pointerMove);
  canvas.addEventListener("pointerup", pointerUp);
  canvas.addEventListener("pointercancel", pointerUp);
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  addEventListener("resize", () => requestAnimationFrame(resize));
  addEventListener("orientationchange", () => setTimeout(resize, 250));
  
  resize();
  newRun();
  
  let lastTime = performance.now();
  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.04);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
