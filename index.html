<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Башня чисел: Эпоха Гоблинов</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #05070a; color: #fff; font-family: system-ui, sans-serif;
    touch-action: none; user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    align-items: center; justify-content: center; text-align: center;
    padding: 28px; background: #0a0c12; color: white;
    font-size: 21px; font-weight: 700; line-height: 1.6;
  }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">Поверни устройство горизонтально<br>и спустись в подземелье ↻</div>

<script>
(() => {
  "use strict";

  const canvas = document.querySelector("#game");
  const ctx = canvas.getContext("2d", { alpha: false });

  const W = 960, H = 600;
  const ROOM_X = 80, ROOM_Y = 80, ROOM_W = 800, ROOM_H = 440;
  
  let dpr = 1, scale = 1, offsetX = 0, offsetY = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    scale = Math.min(canvas.width / W, canvas.height / H);
    offsetX = (canvas.width - W * scale) / 2;
    offsetY = (canvas.height - H * scale) / 2;
  }

  function pointFromEvent(e) {
    return {
      x: (e.clientX * dpr - offsetX) / scale,
      y: (e.clientY * dpr - offsetY) / scale
    };
  }

  const ITEM_POOL = [
    { name: "Кровавый рубин", type: "damage", color: "#ff3333", desc: "+1.5 к урону" },
    { name: "Слеза гоблина", type: "tears", color: "#ffffaa", desc: "Скорострельность ↑" },
    { name: "Крылья ворона", type: "speed", color: "#44aaff", desc: "Скорость ↑" },
    { name: "Глаз провидца", type: "range", color: "#44ff44", desc: "Дальность ↑" },
    { name: "Клинок Титанов", type: "weapon", weapon: "sword", color: "#00ffff", desc: "Ближний бой" },
    { name: "Костяной лук", type: "weapon", weapon: "bow", color: "#ffcc44", desc: "Пробивные стрелы" },
    { name: "Сердце голема", type: "health", color: "#ff44ff", desc: "+1 контейнер здоровья" }
  ];

  const state = {
    floor: 1, rooms: {}, currentRoom: { x: 4, y: 4 },
    hero: null, enemies: [], tears: [], enemyTears: [], drops: [], particles: [], pedestals: [],
    kills: 0, gameOver: false,
    joystick: { active: false, id: null, startX: 0, startY: 0, x: 0, y: 0, dx: 0, dy: 0 },
    rightStick: { active: false, id: null, startX: 0, startY: 0, x: 0, y: 0, dx: 0, dy: 0 },
    keys: {}, shootCooldown: 0, shake: 0, message: "", messageTime: 0,
    transition: 0, roomCooldown: 0, time: 0
  };

  function say(text, duration = 2) {
    state.message = text;
    state.messageTime = duration;
  }

  function addParticle(x, y, color, amount, speed, sizeMax = 4) {
    for (let i = 0; i < amount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = speed * (0.2 + Math.random() * 0.8);
      state.particles.push({
        x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
        life: 0.3 + Math.random() * 0.5, maxLife: 0.8, 
        size: 1 + Math.random() * sizeMax, color
      });
    }
  }

  function generateFloor() {
    state.rooms = {};
    const gridSize = 9;
    let roomCount = 6 + state.floor * 2;
    if (roomCount > 15) roomCount = 15;
    
    const queue = [{x: 4, y: 4}];
    const created = new Set(["4,4"]);
    state.rooms["4,4"] = { x: 4, y: 4, type: 'start', cleared: true, visited: true };
    
    while (created.size < roomCount && queue.length > 0) {
      const current = queue.shift();
      const dirs = [[0,-1],[0,1],[-1,0],[1,0]].sort(() => Math.random() - 0.5);
      
      for (const [dx, dy] of dirs) {
        if (created.size >= roomCount) break;
        const nx = current.x + dx, ny = current.y + dy;
        if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) continue;
        if (created.has(`${nx},${ny}`)) continue;
        
        if (Math.random() < 0.7) {
          created.add(`${nx},${ny}`);
          state.rooms[`${nx},${ny}`] = { x: nx, y: ny, type: 'combat', cleared: false, visited: false };
          queue.push({x: nx, y: ny});
        }
      }
    }
    
    const distances = { "4,4": 0 };
    const bfsQ = [{x: 4, y: 4}];
    let maxDist = 0, bossPos = null;
    while (bfsQ.length > 0) {
      const curr = bfsQ.shift();
      const key = `${curr.x},${curr.y}`;
      if (distances[key] > maxDist && state.rooms[key].type !== 'start') {
        maxDist = distances[key]; bossPos = { x: curr.x, y: curr.y };
      }
      for (const [dx, dy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
        const nk = `${curr.x+dx},${curr.y+dy}`;
        if (state.rooms[nk] && distances[nk] === undefined) {
          distances[nk] = distances[key] + 1;
          bfsQ.push({ x: curr.x+dx, y: curr.y+dy });
        }
      }
    }
    if (bossPos) state.rooms[`${bossPos.x},${bossPos.y}`].type = 'boss';
    
    let treasureAssigned = false;
    for (const key in state.rooms) {
      if (state.rooms[key].type === 'combat' && !treasureAssigned) {
        if (Math.random() < 0.5) { state.rooms[key].type = 'treasure'; treasureAssigned = true; }
      }
    }
    
    for (const key in state.rooms) {
      const r = state.rooms[key];
      r.doors = { top: false, bottom: false, left: false, right: false };
      if (state.rooms[`${r.x},${r.y-1}`]) r.doors.top = true;
      if (state.rooms[`${r.x},${r.y+1}`]) r.doors.bottom = true;
      if (state.rooms[`${r.x-1},${r.y}`]) r.doors.left = true;
      if (state.rooms[`${r.x+1},${r.y}`]) r.doors.right = true;
    }
    
    state.currentRoom = { x: 4, y: 4 };
    state.hero.x = ROOM_X + ROOM_W / 2;
    state.hero.y = ROOM_Y + ROOM_H / 2;
  }

  function changeRoom(dx, dy) {
    const nx = state.currentRoom.x + dx, ny = state.currentRoom.y + dy;
    const next = state.rooms[`${nx},${ny}`];
    if (!next) return;
    
    state.transition = 0.4;
    state.roomCooldown = 0.5; 
    state.currentRoom = { x: nx, y: ny };
    next.visited = true;
    
    // ФИКС ЗАВИСАНИЯ: Обязательно чистим врагов старой комнаты!
    state.enemies = [];
    state.tears = []; state.enemyTears = []; state.particles = []; state.pedestals = [];
    
    if (dx === 1) state.hero.x = ROOM_X + 60;
    if (dx === -1) state.hero.x = ROOM_X + ROOM_W - 60;
    if (dy === 1) state.hero.y = ROOM_Y + 60;
    if (dy === -1) state.hero.y = ROOM_Y + ROOM_H - 60;
    
    if (next.type === 'combat' && !next.cleared) spawnEnemies();
    else if (next.type === 'boss' && !next.cleared) spawnBoss();
    else if (next.type === 'treasure' && !next.cleared) {
      next.cleared = true;
      const item = ITEM_POOL[Math.floor(Math.random() * ITEM_POOL.length)];
      state.pedestals.push({ x: ROOM_X + ROOM_W/2, y: ROOM_Y + ROOM_H/2, item });
    }
  }

  function spawnEnemies() {
    const count = 2 + Math.floor(Math.random() * 3) + Math.floor(state.floor / 2);
    for (let i = 0; i < count; i++) {
      let x, y, attempts = 0;
      do {
        x = ROOM_X + 60 + Math.random() * (ROOM_W - 120);
        y = ROOM_Y + 60 + Math.random() * (ROOM_H - 120);
        attempts++;
      } while (Math.hypot(x - state.hero.x, y - state.hero.y) < 180 && attempts < 50);
      
      const isFly = Math.random() < 0.3;
      state.enemies.push({
        x, y, type: isFly ? 'fly' : 'goblin',
        hp: isFly ? 6 + state.floor : 15 + state.floor * 2,
        maxHp: isFly ? 6 + state.floor : 15 + state.floor * 2,
        speed: isFly ? 3.5 : 2.2, size: isFly ? 10 : 20,
        damage: 1, hit: 0, phase: Math.random() * 10, timer: 0, vx: 0, vy: 0
      });
    }
  }

  function spawnBoss() {
    state.enemies.push({
      x: ROOM_X + ROOM_W/2, y: ROOM_Y + 120, type: 'boss',
      hp: 150 + state.floor * 60, maxHp: 150 + state.floor * 60,
      speed: 1.5, size: 45, damage: 2, hit: 0, phase: 0, timer: 0, shootTimer: 2, vx: 0, vy: 0
    });
  }

  function newRun() {
    state.floor = 1; state.kills = 0; state.gameOver = false;
    state.hero = {
      x: 0, y: 0, hp: 6, maxHp: 6, speed: 3.5, damage: 3.5, tearDelay: 0.35,
      range: 1.0, shotSpeed: 10, coins: 0, keys: 0, weapon: 'tear',
      invuln: 0, facing: 0, moving: false, walkTimer: 0, capeAngle: 0
    };
    state.enemies = []; state.tears = []; state.enemyTears = [];
    state.drops = []; state.particles = []; state.pedestals = [];
    state.shootCooldown = 0; state.shake = 0; state.transition = 0; state.roomCooldown = 0;
    generateFloor();
    say("Убей гоблинов и найди босса!");
  }

  function shoot() {
    const h = state.hero;
    if (state.shootCooldown > 0) return;
    
    let angle = h.facing;
    let target = null, nearest = 1000;
    for (const e of state.enemies) {
      const d = Math.hypot(e.x - h.x, e.y - h.y);
      if (d < nearest) { nearest = d; target = e; }
    }
    
    if (state.rightStick.active && Math.hypot(state.rightStick.dx, state.rightStick.dy) > 0.1) {
      angle = Math.atan2(state.rightStick.dy, state.rightStick.dx);
    } else if (target) {
      angle = Math.atan2(target.y - h.y, target.x - h.x);
    } else if (state.joystick.active && Math.hypot(state.joystick.dx, state.joystick.dy) > 0.1) {
      angle = Math.atan2(state.joystick.dy, state.joystick.dx);
    }
    h.facing = angle;

    if (h.weapon === 'sword') {
      state.tears.push({
        x: h.x + Math.cos(angle) * 30, y: h.y + Math.sin(angle) * 30,
        vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15,
        damage: h.damage * 2, range: 30, dist: 0, size: 30,
        color: "#aaffff", isSword: true, life: 0.15
      });
      state.shootCooldown = h.tearDelay * 0.5;
      state.shake = Math.max(state.shake, 4);
    } else if (h.weapon === 'bow') {
      state.tears.push({
        x: h.x + Math.cos(angle) * 15, y: h.y + Math.sin(angle) * 15,
        vx: Math.cos(angle) * 15 * h.shotSpeed, vy: Math.sin(angle) * 15 * h.shotSpeed,
        damage: h.damage * 0.8, range: 60 * h.range, dist: 0, size: 4,
        color: "#ffcc44", life: 2
      });
      state.shootCooldown = h.tearDelay;
    } else {
      state.tears.push({
        x: h.x + Math.cos(angle) * 15, y: h.y + Math.sin(angle) * 15,
        vx: Math.cos(angle) * 8 * h.shatanotSpeed, vy: Math.sin(angle) * 8 * h.sh2otSpeed,
        damage: h.damage(h, range: .y60 * h.range, dist: 0, size -: 7,
        color: e "#00ffff", life: 2
      });
      state.shootCooldown = h.tearDelay;
    }
  }

  function damageEnemy(e, dmg) {
    e.hp -= dmg;
    e.hit = 0.1;
    state.shake = Math.max(state.shake, 3);
    addParticle(e.x, e.y, "#ff3333", 4, 80, 3);
    
    if (e.hp <= 0) {
      state.kills++;
      const idx = state.enemies.indexOf(e);
      if (idx > -1) state.enemies.splice(idx, 1);
      addParticle(e.x, e.y, e.type === 'boss' ? "#aa44ff" : "#88ff88", 20, 150, 5);
      
      if (e.type === 'boss') {
        state.drops.push({ x: e.x, y: e.y, type: 'trapdoor', phase: 0 });
        state.drops.push({ x: e.x + 40, y: e.y, type: 'heart', phase: 0 });
      } else {
        if (Math.random() < 0.15) state.drops.push({ x: e.x, y: e.y, type: 'coin', phase: 0 });
        if (Math.random() < 0.08) state.drops.push({ x: e.x, y: e.y, type: 'heart', phase: 0 });
      }
    }
  }

  function applyItem(item) {
    const h = state.hero;
    if (item.type === 'health') { h.maxHp += 2; h.hp += 2; }
    else if (item.type === 'damage') h.damage += 1.5;
    else if (item.type === 'tears') h.tearDelay *= 0.75;
    else if (item.type === 'speed') h.speed += 0.5;
    else if (item.type === 'range') h.range += 0.5;
    else if (item.type === 'weapon') h.weapon = item.weapon;
    
    addParticle(h.x, h.y, item.color, 30, 180, 6);
    say("Получено: " + item.name, 2.5);
  }

  function update(dt) {
    if (state.gameOver) return;
    state.time += dt;
    if (state.transition > 0) { state.transition -= dt * 3; if (state.transition < 0) state.transition = 0; }
    if (state.messageTime > 0) state.messageTime -= dt;
    if (state.roomCooldown > 0) state.roomCooldown -= dt;
    
    state.shake = Math.max(0, state.shake - dt * 20);
    state.shootCooldown = Math.max(0, state.shootCooldown - dt);
    const h = state.hero;
    h.invuln = Math.max(0, h.invuln - dt);

    let mx = 0, my = 0;
    if (state.joystick.active) {
      mx = state.joystick.dx; my = state.joystick.dy;
    } else {
      if (state.keys['a'] || state.keys['arrowleft']) mx -= 1;
      if (state.keys['d'] || state.keys['arrowright']) mx += 1;
      if (state.keys['w'] || state.keys['arrowup']) my -= 1;
      if (state.keys['s'] || state.keys['arrowdown']) my += 1;
    }
    
    const len = Math.hypot(mx, my);
    if (len > 0.1) {
      mx /= len; my /= len;
      h.x += mx * h.speed * 60 * dt;
      h.y += my * h.speed * 60 * dt;
      h.walkTimer += dt * 15;
      h.moving = true;
      h.capeAngle = Math.atan2(my, mx) + Math.PI; 
    } else {
      h.moving = false;
    }

    let shooting = false;
    if (state.rightStick.active) shooting = Math.hypot(state.rightStick.dx, state.rightStick.dy) > 0.3;
    else if (state.keys[' ']) shooting = true;
    if (shooting && state.shootCooldown <= 0) shoot();

    const room = state.rooms[`${state.currentRoom.x},${state.currentRoom.y}`];
    
    if (room.cleared && state.roomCooldown <= 0) {
      if (room.doors.top && h.y < ROOM_Y + 25 && Math.abs(h.x - (ROOM_X + ROOM_W/2)) < 40) { changeRoom(0, -1); return; }
      if (room.doors.bottom && h.y > ROOM_Y + ROOM_H - 25 && Math.abs(h.x - (ROOM_X + ROOM_W/2)) < 40) { changeRoom(0, 1); return; }
      if (room.doors.left && h.x < ROOM_X + 25 && Math.abs(h.y - (ROOM_Y + ROOM_H/2)) < 40) { changeRoom(-1, 0); return; }
      if (room.doors.right && h.x > ROOM_X + ROOM_W - 25 && Math.abs(h.y - (ROOM_Y + ROOM_H/2)) < 40) { changeRoom(1, 0); return; }
    }
    h.x = Math.max(ROOM_X + 20, Math.min(ROOM_X + ROOM_W - 20, h.x));
    h.y = Math.max(ROOM_Y + 20, Math.min(ROOM_Y + ROOM_H - 20, h.y));

    for (let i = state.enemies.length - 1; i >= 0; i--) {
      const e = state.enemies[i];
      e.phase += dt * 5;
      if (e.hit > 0) e.hit -= dt;

      if (e.type === 'goblin') {
        e.timer += dt;
        if (e.timer > 1.2) {
          e.timer = 0;
          const ang = Math..y, h.x - e.x);
          e.vx = Math.cos(ang) * 160; e.vy = Math.sin(ang) * 160;
        }
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.vx *= 0.9; e.vy *= 0.9;
      } else if (e.type === 'fly') {
        const ang = Math.atan2(h.y - e.y, h.x - e.x);
        e.x += Math.cos(ang + Math.sin(e.phase)*0.8) * e.speed * 60 * dt;
        e.y += Math.sin(ang + Math.sin(e.phase)*0.8) * e.speed * 60 * dt;
      } else if (e.type === 'boss') {
        const ang = Math.atan2(h.y - e.y, h.x - e.x);
        if (Math.hypot(h.x - e.x, h.y - e.y) > 160) {
          e.x += Math.cos(ang) * e.speed * 60 * dt;
          e.y += Math.sin(ang) * e.speed * 60 * dt;
        }
        e.shootTimer -= dt;
        if (e.shootTimer <= 0) {
          e.shootTimer = 1.6;
          for (let a = -1; a <= 1; a++) {
            state.enemyTears.push({
              x: e.x, y: e.y, vx: Math.cos(ang + a * 0.35) * 5, vy: Math.sin(ang + a * 0.35) * 5,
              damage: 1, life: 3, size: 9, color: "#ff00aa"
            });
          }
        }
      }

      if (Math.hypot(h.x - e.x, h.y - e.y) < 18 + e.size && h.invuln <= 0) {
        h.hp -= e.damage;
        h.invuln = 1.0;
        state.shake = 12;
        addParticle(h.x, h.y, "#ff0000", 15, 180, 4);
        const kbAng = Math.atan2(h.y - e.y, h.x - e.x);
        h.x += Math.cos(kbAng) * 40; h.y += Math.sin(kbAng) * 40;
        if (h.hp <= 0) { h.hp = 0; state.gameOver = true; }
      }
    }

    for (let i = state.tears.length - 1; i >= 0; i--) {
      const t = state.tears[i];
      t.x += t.vx * 60 * dt; t.y += t.vy * 60 * dt;
      t.life -= dt;
      
      let hit = false;
      for (const e of state.enemies) {
        if (Math.hypot(e.x - t.x, e.y - t.y) < e.size + t.size) {
          damageEnemy(e, t.damage);
          hit = true;
          if (!t.isSword && state.hero.weapon !== 'bow') break;
        }
      }
      if (hit || t.life <= 0 || t.x < ROOM_X || t.x > ROOM_X + ROOM_W || t.y < ROOM_Y || t.y > ROOM_Y + ROOM_H) {
        state.tears.splice(i, 1);
      }
    }

    for (let i = state.enemyTears.length - 1; i >= 0; i--) {
      const t = state.enemyTears[i];
      t.x += t.vx * 60 * dt; t.y += t.vy * 60 * dt; t.life -= dt;
      
      if (Math.hypot(h.x - t.x, h.y - t.y) < 15 + t.size && h.invuln <= 0) {
        h.hp -= t.damage; h.invuln = 1.0; state.shake = 8;
        addParticle(h.x, h.y, "#ff0000", 8, 100);
        if (h.hp <= 0) { h.hp = 0; state.gameOver = true; }
        state.enemyTears.splice(i, 1); continue;
      }
      if (t.life <= 0 || t.x < ROOM_X || t.x > ROOM_X + ROOM_W || t.y < ROOM_Y || t.y > ROOM_Y + ROOM_H) {
        state.enemyTears.splice(i, 1);
      }
    }

    for (let i = state.drops.length - 1; i >= 0; i--) {
      const d = state.drops[i];
      d.phase += dt * 3;
      if (d.type === 'trapdoor') {
        if (Math.hypot(h.x - d.x, h.y - d.y) < 30) {
          state.floor++; state.drops = []; state.enemies = []; generateFloor();
          return;
        }
      } else if (Math.hypot(h.x - d.x, h.y - d.y) < 25) {
        if (d.type === 'coin') { h.coins++; say("Монета!"); }
        else if (d.type === 'heart') {
          if (h.hp >= h.maxHp) continue;
          h.hp = Math.min(h.maxHp, h.hp + 2); say("Сердце!");
        }
        state.drops.splice(i, 1);
      }
    }

    for (let i = state.pedestals.length - 1; i >= 0; i--) {
      const p = state.pedestals[i];
      if (Math.hypot(h.x - p.x, h.y - p.y) < 30) {
        applyItem(p.item);
        state.pedestals.splice(i, 1);
      }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92; p.life -= dt;
      if (p.life <= 0) state.particles.splice(i, 1);
    }

    if (state.enemies.length === 0 && !room.cleared && room.type !== 'start') {
      room.cleared = true;
      addParticle(ROOM_X + ROOM_W/2, ROOM_Y + ROOM_H/2, "#ffffff", 30, 100, 5);
    }
  }

  // --- ГРАФИКА (ПСЕВДО-3D) ---
  
  // Кэш для фоновой плитки, чтобы не нагружать процессор каждый кадр
  let bgCache = null;
  function renderBgToCache() {
    bgCache = document.createElement("canvas");
    bgCache.width = W; bgCache.height = H;
    const bCtx = bgCache.getContext("2d");
    
    // Глубокий темный фон
    bCtx.fillStyle = "#080a10";
    bCtx.fillRect(0, 0, W, H);
    
    // Объемные стены (верхняя и боковые с перспективой)
    bCtx.fillStyle = "#11141c";
    bCtx.beginPath();
    bCtx.moveTo(ROOM_X - 40, ROOM_Y - 40);
    bCtx.lineTo(ROOM_X + ROOM_W + 40, ROOM_Y - 40);
    bCtx.lineTo(ROOM_X + ROOM_W + 20, ROOM_Y + ROOM_H + 20);
    bCtx.lineTo(ROOM_X - 20, ROOM_Y + ROOM_H + 20);
    bCtx.fill();
    
    // Пол (плитка с текстурой камня)
    bCtx.fillStyle = "#1c2028";
    bCtx.fillRect(ROOM_X, ROOM_Y, ROOM_W, ROOM_H);
    
    bCtx.strokeStyle = "#0c0e12";
    bCtx.lineWidth = 2;
    for (let x = ROOM_X; x <= ROOM_X + ROOM_W; x += 50) {
      bCtx.beginPath(); bCtx.moveTo(x, ROOM_Y); bCtx.lineTo(x, ROOM_Y + ROOM_H); bCtx.stroke();
    }
    for (let y = ROOM_Y; y <= ROOM_Y + ROOM_H; y += 50) {
      bCtx.beginPath(); bCtx.moveTo(ROOM_X, y); bCtx.lineTo(ROOM_X + ROOM_W, y); bCtx.stroke();
    }
    
    // Трещины на полу
    bCtx.strokeStyle = "#0a0c10"; bCtx.lineWidth = 1;
    for (let i = 0; i < 20; i++) {
      const cx = ROOM_X + Math.random() * ROOM_W;
      const cy = ROOM_Y + Math.random() * ROOM_H;
      bCtx.beginPath(); bCtx.moveTo(cx, cy);
      bCtx.lineTo(cx + (Math.random()-0.5)*30, cy + (Math.random()-0.5)*30);
      bCtx.stroke();
    }
  }

  function drawRoomBg() {
    if (!bgCache) renderBgToCache();
    ctx.drawImage(bgCache, 0, 0);

    // Свет по центру (Динамический)
    const grad = ctx.createRadialGradient(ROOM_X + ROOM_W/2, ROOM_Y + ROOM_H/2, 50, ROOM_X + ROOM_W/2, ROOM_Y + ROOM_H/2, 500);
    grad.addColorStop(0, "rgba(60, 80, 110, 0.15)");
    grad.addColorStop(1, "rgba(0, 0, 0, 0.6)");
    ctx.fillStyle = grad;
    ctx.fillRect(ROOM_X, ROOM_Y, ROOM_W, ROOM_H);

    // Живые факелы по углам
    const drawTorch = (x, y) => {
      // Свет от факела
      const tGrad = ctx.createRadialGradient(x, y, 10, x, y, 180);
      tGrad.addColorStop(0, "rgba(255, 140, 50, 0.4)");
      tGrad.addColorStop(1, "rgba(255, 140, 50, 0)");
      ctx.fillStyle = tGrad;
      ctx.fillRect(x - 180, y - 180, 360, 360);
      
      // Подставка
      ctx.fillStyle = "#222"; ctx.fillRect(x - 4, y - 5, 8, 15);
      // Огонь
      ctx.fillStyle = "#ffbb00"; 
      ctx.shadowColor = "#ffbb00"; ctx.shadowBlur = 15;
      ctx.beginPath(); 
      ctx.ellipse(x, y, 7 + Math.sin(state.time*12)*2, 10 + Math.cos(state.time*10)*3, 0, 0, Math.PI*2); 
      ctx.fill();
      ctx.shadowBlur = 0;
    };
    drawTorch(ROOM_X + 20, ROOM_Y + 20);
    drawTorch(ROOM_X + ROOM_W - 20, ROOM_Y + 20);
    drawTorch(ROOM_X + 20, ROOM_Y + ROOM_H - 20);
    drawTorch(ROOM_X + ROOM_W - 20, ROOM_Y + ROOM_H - 20);

    // Двери (Массивные каменные арки)
    const r = state.rooms[`${state.currentRoom.x},${state.currentRoom.y}`];
    const drawDoor = (x, y, w, h, open, dir) => {
      // Проем
      ctx.fillStyle = open ? "#000000" : "#2a3441";
      ctx.fillRect(x - w/2, y - h/2, w, h);
      
      if (open) {
        ctx.strokeStyle = "#4a7a9a"; ctx.lineWidth = 2;
        ctx.strokeRect(x - w/2, y - h/2, w, h);
        // Магический барьер
        ctx.fillStyle = "rgba(100, 200, 255, 0.1)";
        ctx.fillRect(x - w/2, y - h/2, w, h);
      } else {
        // Запертая дверь (решетка)
        ctx.strokeStyle = "#1a2028"; ctx.lineWidth = 4;
        for(let i=-w/2; i<w/2; i+=10) {
          ctx.beginPath(); ctx.moveTo(x+i, y-h/2); ctx.lineTo(x+i, y+h/2); ctx.stroke();
        }
      }
    };
    if (r.doors.top) drawDoor(ROOM_X + ROOM_W/2, ROOM_Y, 80, 20, r.cleared, 'top');
    if (r.doors.bottom) drawDoor(ROOM_X + ROOM_W/2, ROOM_Y + ROOM_H, 80, 20, r.cleared, 'bottom');
    if (r.doors.left) drawDoor(ROOM_X, ROOM_Y + ROOM_H/2, 20, 80, r.cleared, 'left');
    if (r.doors.right) drawDoor(ROOM_X + ROOM_W, ROOM_Y + ROOM_H/2, 20, 80, r.cleared, 'right');
  }

  function drawHero() {
    const h = state.hero;
    const flicker = h.invuln > 0 && Math.floor(performance.now() / 80) % 2 === 0;
    
    // Объемная тень
    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
    ctx.beginPath(); ctx.ellipse(h.x, h.y + 22, 18, 8, 0, 0, Math.PI * 2); ctx.fill();

    if (flicker) ctx.globalAlpha = 0.4;

    const bob = h.moving ? Math.sin(h.walkTimer) * 3 : 0;
    
    // Развевающийся плащ (сзади)
    ctx.fillStyle = "#2b1b3d"; // Темно-фиолетовый
    ctx.beginPath();
    ctx.moveTo(h.x - 15, h.y - 10 + bob);
    ctx.quadraticCurveTo(h.x + Math.cos(h.capeAngle)*25, h.y + Math.sin(h.capeAngle)*25 + bob, h.x + 15, h.y - 10 + bob);
    ctx.quadraticCurveTo(h.x, h.y + 20 + bob, h.x - 15, h.y - 10 + bob);
    ctx.fill();

    // Тело (Броня)
    ctx.fillStyle = "#4a5568"; // Стальной цвет
    ctx.beginPath(); ctx.ellipse(h.x, h.y + 5 + bob, 12, 16, 0, 0, Math.PI * 2); ctx.fill();
    
    // Наплечники
    ctx.fillStyle = "#718096";
    ctx.beginPath(); ctx.arc(h.x - 12, h.y - 2 + bob, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(h.x + 12, h.y - 2 + bob, 6, 0, Math.PI * 2); ctx.fill();

    // Голова (Капюшон)
    ctx.fillStyle = "#1a202c";
    ctx.beginPath(); ctx.arc(h.x, h.y - 12 + bob, 15, 0, Math.PI * 2); ctx.fill();
    
    // Лицо/Тень внутри капюшона
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(h.x, h.y - 10 + bob, 9, 0, Math.PI * 2); ctx.fill();
    
    // Светящиеся глаза
    ctx.fillStyle = "#00ffff";
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(h.x - 4, h.y - 12 + bob, 2, 0, Math.PI * 2);
    ctx.arc(h.x + 4, h.y - 12 + bob, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Оружие
    ctx.save();
    ctx.translate(h.x, h.y - 5 + bob); ctx.rotate(h.facing);
    
    if (h.weapon === 'sword') {
      ctx.shadowColor = "#00ffff"; ctx.shadowBlur = 15;
      // Рукоять
      ctx.fillStyle = "#8b5a2b"; ctx.fillRect(8, -3, 8, 6);
      // Лезвие
      ctx.fillStyle = "#aaffff"; 
      ctx.beginPath(); ctx.moveTo(16, -5); ctx.lineTo(45, 0); ctx.lineTo(16, 5); ctx.fill();
    } else if (h.weapon === 'bow') {
      ctx.shadowColor = "#ffcc44"; ctx.shadowBlur = 10;
      ctx.strokeStyle = "#ffcc44"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(15, 0, 18, -Math.PI/2, Math.PI/2); ctx.stroke();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(15, -18); ctx.lineTo(15, 18); ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();

    ctx.globalAlpha = 1;
  }

  function drawEnemy(e) {
    // Тень
    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
    ctx.beginPath(); ctx.ellipse(e.x, e.y + e.size/2 + 5, e.size * 0.8, e.size/2, 0, 0, Math.PI * 2); ctx.fill();

    if (e.type === 'goblin') {
      const squash = Math.sin(e.phase * 2) * 0.1 + 1;
      
      // Ноги
      ctx.fillStyle = "#2e4a1f"; // Темно-зеленый
      ctx.beginPath();
      ctx.ellipse(e.x - 8, e.y + 12, 4, 8, 0.2, 0, Math.PI * 2);
      ctx.ellipse(e.x + 8, e.y + 12, 4, 8, -0.2, 0, Math.PI * 2);
      ctx.fill();

      // Тело
      const bodyGrad = ctx.createRadialGradient(e.x-5, e.y-5, 2, e.x, e.y, e.size);
      bodyGrad.addColorStop(0, e.hit > 0 ? "#ffffff" : "#8bc34a"); // Светло-зеленый (кожа)
      bodyGrad.addColorStop(1, e.hit > 0 ? "#aaaaaa" : "#4caf50");
      ctx.fillStyle = bodyGrad;
      ctx.beginPath(); ctx.ellipse(e.x, e.y, e.size * 0.8, e.size * squash, 0, 0, Math.PI * 2); ctx.fill();
      
      // Уши (Острые)
      ctx.fillStyle = e.hit > 0 ? "#fff" : "#8bc34a";
      ctx.beginPath();
      ctx.moveTo(e.x - 12, e.y - 5); ctx.lineTo(e.x - 25, e.y - 15); ctx.lineTo(e.x - 10, e.y + 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(e.x + 12, e.y - 5); ctx.lineTo(e.x + 25, e.y - 15); ctx.lineTo(e.x + 10, e.y + 2); ctx.fill();

      // Волосы
      ctx.fillStyle = "#1a1a1a";
      ctx.beginPath();
      ctx.moveTo(e.x - 10, e.y - 10); ctx.lineTo(e.x - 5, e.y - 22); ctx.lineTo(e.x, e.y - 12);
      ctx.lineTo(e.x + 5, e.y - 25); ctx.lineTo(e.x + 10, e.y - 10); ctx.fill();

      // Красные глаза
      ctx.fillStyle = "#ff0000";
      ctx.shadowColor = "#ff0000"; ctx.shadowBlur = 5;
      ctx.beginPath(); ctx.arc(e.x - 5, e.y - 4, 2.5, 0, Math.PI * 2); ctx.arc(e.x + 5, e.y - 4, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;

      // Дубина
      ctx.fillStyle = "#5c4033";
      ctx.save();
      ctx.translate(e.x + 10, e.y + 5);
      ctx.rotate(Math.sin(e.phase)*0.2);
      ctx.fillRect(0, 0, 6, 18);
      ctx.fillStyle = "#3e2723"; ctx.fillRect(-2, 18, 10, 8);
      ctx.restore();

    } else if (e.type === 'fly') {
      const wing = Math.sin(e.phase * 15) * 10;
      
      // Тело
      ctx.fillStyle = e.hit > 0 ? "#fff" : "#333";
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2); ctx.fill();
      
      // Глаза (фасеточные)
      ctx.fillStyle = "#ff0000";
      ctx.beginPath(); ctx.arc(e.x - 4, e.y - 2, 3, 0, Math.PI*2); ctx.arc(e.x + 4, e.y - 2, 3, 0, Math.PI*2); ctx.fill();

      // Крылья (полупрозрачные)
      ctx.fillStyle = "rgba(200, 220, 255, 0.6)";
      ctx.beginPath();
      ctx.ellipse(e.x - 8, e.y - 5, 12, Math.abs(wing), -0.4, 0, Math.PI * 2);
      ctx.ellipse(e.x + 8, e.y - 5, 12, Math.abs(wing), 0.4, 0, Math.PI * 2);
      ctx.fill();

    } else if (e.type === 'boss') {
      // Аура
      ctx.shadowColor = "#ff00aa"; ctx.shadowBlur = 40;
      
      const grad = ctx.createRadialGradient(e.x, e.y, 10, e.x, e.y, e.size);
      grad.addColorStop(0, e.hit > 0 ? "#fff" : "#8b0000"); // Темно-красный
      grad.addColorStop(1, "#3a001a");
      
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      
      // Рога (как на референсе)
      ctx.fillStyle = "#ffcc44";
      ctx.beginPath();
      ctx.moveTo(e.x - 25, e.y - 25); ctx.lineTo(e.x - 50, e.y - 70); ctx.lineTo(e.x - 10, e.y - 40);
      ctx.moveTo(e.x + 25, e.y - 25); ctx.lineTo(e.x + 50, e.y - 70); ctx.lineTo(e.x + 10, e.y - 40);
      ctx.fill();
      
      // Уши
      ctx.fillStyle = "#8b0000";
      ctx.beginPath();
      ctx.moveTo(e.x - 30, e.y); ctx.lineTo(e.x - 60, e.y - 20); ctx.lineTo(e.x - 25, e.y + 10); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(e.x + 30, e.y); ctx.lineTo(e.x + 60, e.y - 20); ctx.lineTo(e.x + 25, e.y + 10); ctx.fill();

      // Лицо
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(e.x - 15, e.y - 10, 8, 0, Math.PI * 2); ctx.arc(e.x + 15, e.y - 10, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ff0000";
      ctx.beginPath(); ctx.arc(e.x - 15, e.y - 10, 4, 0, Math.PI * 2); ctx.arc(e.x + 15, e.y - 10, 4, 0, Math.PI * 2); ctx.fill();
      
      // Клыки
      ctx.fillStyle = "#eee";
      ctx.beginPath();
      ctx.moveTo(e.x - 10, e.y + 15); ctx.lineTo(e.x - 5, e.y + 30); ctx.lineTo(e.x, e.y + 15);
      ctx.moveTo(e.x + 10, e.y + 15); ctx.lineTo(e.x + 5, e.y + 30); ctx.lineTo(e.x, e.y + 15);
      ctx.fill();
    }
  }

  function drawHeart(x, y, size, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.3);
    ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.3);
    ctx.bezierCurveTo(x - size, y + size * 0.7, x, y + size * 1.1, x, y + size * 1.1);
    ctx.bezierCurveTo(x, y + size * 1.1, x + size, y + size * 0.7, x + size, y + size * 0.3);
    ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
    ctx.fill();
  }

  function drawUI() {
    // Сердца (Объемные)
    let maxHearts = Math.ceil(state.hero.maxHp / 2), chp = state.hero.hp;
    for (let i = 0; i < maxHearts; i++) {
      const hx = 40 + (i % 6) * 35, hy = 40 + Math.floor(i / 6) * 35;
      // Фон (пустое сердце)
      drawHeart(hx, hy, 12, "#2a0a0a");
      ctx.strokeStyle = "#111"; ctx.lineWidth = 2; ctx.stroke();
      
      if (chp >= 2) {
        ctx.shadowColor = "#ff0000"; ctx.shadowBlur = 10;
        drawHeart(hx, hy, 12, "#ff3333");
        ctx.shadowBlur = 0;
      } else if (chp === 1) {
        ctx.save(); ctx.beginPath(); ctx.rect(hx - 15, hy - 15, 15, 30); ctx.clip();
        drawHeart(hx, hy, 12, "#ff3333"); ctx.restore();
      }
      chp -= 2; if (chp < 0) chp = 0;
    }
    
    // Монеты и Этаж
    ctx.font = "bold 18px system-ui"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffdd44"; ctx.shadowColor = "#ffdd44"; ctx.shadowBlur = 5; 
    ctx.fillText("🪙 " + state.hero.coins, W - 180, 40);
    ctx.fillStyle = "#fff"; ctx.shadowBlur = 0; ctx.fillText("ЭТАЖ " + state.floor, W - 180, 70);

    // Миникарта (Стилизованная под пергамент)
    const size = 14, startX = W - 140, startY = 110;
    ctx.fillStyle = "rgba(20, 15, 10, 0.8)"; 
    ctx.beginPath(); ctx.roundRect(startX - 15, startY - 15, 120, 100, 10); ctx.fill();
    ctx.strokeStyle = "#5a4a35"; ctx.lineWidth = 2; ctx.stroke();
    
    for (const key in state.rooms) {
      const room = state.rooms[key];
      if (!room.visited) continue;
      const rx = startX + (room.x - state.currentRoom.x) * size + 45;
      const ry = startY + (room.y - state.currentRoom.y) * size + 35;
      if (rx < startX || rx > startX + 90 || ry < startY || ry > startY + 70) continue;
      
      if (room.x === state.currentRoom.x && room.y === state.currentRoom.y) { ctx.fillStyle = "#fff"; ctx.shadowColor = "#fff"; ctx.shadowBlur = 5; }
      else if (room.type === 'boss') { ctx.fillStyle = "#ff3333"; ctx.shadowColor = "#ff3333"; ctx.shadowBlur = 5; }
      else if (room.type === 'treasure') { ctx.fillStyle = "#ffff44"; ctx.shadowColor = "#ffff44"; ctx.shadowBlur = 5; }
      else if (room.cleared) { ctx.fillStyle = "#556677"; ctx.shadowBlur = 0; }
      else { ctx.fillStyle = "#334455"; ctx.shadowBlur = 0; }
      
      ctx.fillRect(rx, ry, size - 3, size - 3);
    }
    ctx.shadowBlur = 0;

    // Полоса Босса
    if (state.currentRoom && state.rooms[`${state.currentRoom.x},${state.currentRoom.y}`].type === 'boss') {
      const boss = state.enemies.find(e => e.type === 'boss');
      if (boss) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.9)"; ctx.fillRect(W/2 - 200, H - 40, 400, 20);
        ctx.strokeStyle = "#ff00aa"; ctx.lineWidth = 2; ctx.strokeRect(W/2 - 200, H - 40, 400, 20);
        ctx.fillStyle = "#ff00aa"; ctx.fillRect(W/2 - 198, H - 38, 396 * Math.max(0, boss.hp / boss.maxHp), 16);
        ctx.fillStyle = "#fff"; ctx.font = "bold 14px system-ui"; ctx.textAlign = "center";
        ctx.fillText("ВЛАДЫКА ГОБЛИНОВ", W/2, H - 55);
      }
    }

    // Стики (Джойстики)
    const drawStick = (baseX, baseY, stick, color) => {
      // Внешнее кольцо
      ctx.fillStyle = "rgba(0, 0, 0, 0.4)"; 
      ctx.beginPath(); ctx.arc(baseX, baseY, 60, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.2)"; ctx.lineWidth = 2; ctx.stroke();
      
      // Внутренняя ручка
      let sx = baseX, sy = baseY;
      if (stick.active) { sx = stick.x; sy = stick.y; }
      ctx.fillStyle = color; 
      ctx.shadowColor = color; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(sx, sy, 25, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    };
    drawStick(110, H - 110, state.joystick, "rgba(200, 220, 255, 0.8)");
    drawStick(W - 110, H - 110, state.rightStick, "rgba(255, 150, 150, 0.8)");

    // Сообщение
    if (state.messageTime > 0) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.9)"; 
      ctx.beginPath(); ctx.roundRect(W/2 - 200, H - 80, 400, 40, 10); ctx.fill();
      ctx.strokeStyle = "#ffd700"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold 16px system-ui";
      ctx.fillText(state.message, W/2, H - 55);
    }
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#05070a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);

    const sx = (Math.random() - 0.5) * state.shake;
    const sy = (Math.random() - 0.5) * state.shake;
    ctx.save();
    ctx.translate(sx, sy);

    drawRoomBg();

    // Дропы (Монеты, Сердца, Люки)
    for (const d of state.drops) {
      const bob = Math.sin(d.phase + state.time*2) * 5;
      if (d.type === 'trapdoor') {
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.ellipse(d.x, d.y, 35, 20, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#aa44ff"; ctx.lineWidth = 4; ctx.shadowColor = "#aa44ff"; ctx.shadowBlur = 15; ctx.stroke();
        ctx.shadowBlur = 0;
      } else if (d.type === 'coin') {
        ctx.fillStyle = "#ffdd44"; ctx.shadowColor = "#ffdd44"; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(d.x, d.y + bob, 10, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      } else if (d.type === 'heart') {
        drawHeart(d.x, d.y + bob - 10, 12, "#ff3333");
      }
    }

    // Пьедесталы с предметами
    for (const p of state.pedestals) {
      ctx.fillStyle = "#222"; ctx.beginPath(); ctx.ellipse(p.x, p.y + 15, 30, 15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#444"; ctx.fillRect(p.x - 12, p.y - 10, 24, 25);
      
      const bob = Math.sin(state.time * 3) * 8;
      ctx.shadowColor = p.item.color; ctx.shadowBlur = 20;
      ctx.fillStyle = p.item.color; 
      ctx.beginPath(); ctx.arc(p.x, p.y - 25 + bob, 15, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    for (const e of state.enemies) drawEnemy(e);

    // Снаряды игрока (Светящиеся)
    for (const t of state.tears) {
      ctx.shadowColor = t.color; ctx.shadowBlur = 10;
      ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      
      if (!t.isSword) {
        // Шлейф
        ctx.fillStyle = t.color + "44";
        ctx.beginPath(); ctx.ellipse(t.x - t.vx*0.5, t.y - t.vy*0.5, t.size*1.5, t.size*0.8, Math.atan2(t.vy, t.vx), 0, Math.PI * 2); ctx.fill();
      }
    }
    
    // Снаряды врагов
    for (const t of state.enemyTears) {
      ctx.shadowColor = t.color; ctx.shadowBlur = 15;
      ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    drawHero();

    // Частицы (Кровь, искры)
    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color; 
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    drawUI();

    if (state.transition > 0) {
      ctx.fillStyle = `rgba(0, 0, 0, ${state.transition})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state.gameOver) {
      ctx.fillStyle = "rgba(20, 0, 0, 0.95)"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ff3333"; ctx.font = "bold 50px system-ui"; ctx.textAlign = "center";
      ctx.shadowColor = "#ff0000"; ctx.shadowBlur = 20;
      ctx.fillText("ВЫ ПОГИБЛИ", W/2, H/2 - 20);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#fff"; ctx.font = "20px system-ui";
      ctx.fillText("Этаж " + state.floor + " | Убито врагов: " + state.kills, W/2, H/2 + 40);
      ctx.fillStyle = "#aaa"; ctx.fillText("Нажмите, чтобы начать заново", W/2, H/2 + 90);
    }
  }

  // Ввод
  function pointerDown(e) {
    e.preventDefault();
    if (state.gameOver) { newRun(); return; }
    const p = pointFromEvent(e);
    if (p.x < W / 2) {
      state.joystick.active = true; state.joystick.id = e.pointerId;
      state.joystick.startX = p.x; state.joystick.startY = p.y;
      state.joystick.x = p.x; state.joystick.y = p.y; state.joystick.dx = 0; state.joystick.dy = 0;
    } else {
      state.rightStick.active = true; state.rightStick.id = e.pointerId;
      state.rightStick.startX = p.x; state.rightStick.startY = p.y;
      state.rightStick.x = p.x; state.rightStick.y = p.y; state.rightStick.dx = 0; state.rightStick.dy = 0;
    }
  }

  function pointerMove(e) {
    const p = pointFromEvent(e);
    if (state.joystick.active && state.joystick.id === e.pointerId) {
      let dx = p.x - state.joystick.startX, dy = p.y - state.joystick.startY;
      const len = Math.hypot(dx, dy);
      if (len > 60) { dx *= 60 / len; dy *= 60 / len; }
      state.joystick.dx = dx / 60; state.joystick.dy = dy / 60;
      state.joystick.x = state.joystick.startX + dx; state.joystick.y = state.joystick.startY + dy;
    }
    if (state.rightStick.active && state.rightStick.id === e.pointerId) {
      let dx = p.x - state.rightStick.startX, dy = p.y - state.rightStick.startY;
      const len = Math.hypot(dx, dy);
      if (len > 60) { dx *= 60 / len; dy *= 60 / len; }
      state.rightStick.dx = dx / 60; state.rightStick.dy = dy / 60;
      state.rightStick.x = state.rightStick.startX + dx; state.rightStick.y = state.rightStick.startY + dy;
    }
  }

  function pointerUp(e) {
    if (state.joystick.id === e.pointerId) {
      state.joystick.active = false; state.joystick.dx = 0; state.joystick.dy = 0;
    }
    if (state.rightStick.id === e.pointerId) {
      state.rightStick.active = false; state.rightStick.dx = 0; state.rightStick.dy = 0;
    }
  }

  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
    state.keys[k] = true;
  });
  addEventListener("keyup", e => { state.keys[e.key.toLowerCase()] = false; });

  canvas.addEventListener("pointerdown", pointerDown);
  canvas.addEventListener("pointermove", pointerMove);
  canvas.addEventListener("pointerup", pointerUp);
  canvas.addEventListener("pointercancel", pointerUp);
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  addEventListener("resize", () => requestAnimationFrame(resize));
  addEventListener("orientationchange", () => setTimeout(resize, 250));
  
  resize();
  newRun();
  
  let lastTime = performance.now();
  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.04);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
